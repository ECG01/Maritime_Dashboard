name = "caricoos-maritime-chat"
main = "worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# CONTEXT_URL ya NO vive aqui. Cambia segun donde este desplegado el tablero,
# asi que en un archivo versionado cada `git pull` lo pisaba y un `deploy`
# posterior rompia el chatbot en silencio - paso el 2026-10-06.
# Se pone como SECRETO, que es lo unico que `wrangler deploy` no toca:
#   npx wrangler secret put CONTEXT_URL
# El valor es la URL publica de chat_context.json, p.ej.
#   https://<host>/Maritime_Dashboard/chat_context.json


# Secrets are NOT set here - they would end up in version control.
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put CHAT_ACCESS_TOKEN
